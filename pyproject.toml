[project]
name = "privacy-and-grokking"
version = "3.0.0"
description = "Understanding how Grokking affects privacy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "captum==0.7.0",
    "ipykernel==7.0.1",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "onnx==1.19.1",
    "onnxscript==0.5.6",
    "polars==1.35.1",
    "pydantic==2.12.4",
    "rsatoolbox==0.3.0",
    "tqdm==4.67.1",
    "typer==0.20.0",
]

[dependency-groups]
dev = [
    "poethepoet==0.40.0",
    "pytest==9.0.2",
    "ruff==0.14.14",
    "ty==0.0.13",
]

[project.scripts]
pag = "privacy_and_grokking.cli:app"

[project.optional-dependencies]
cpu = [
  "torch==2.9.0",
  "torchvision>=0.24.0",
]
cu128 = [
  "torch==2.9.0",
  "torchvision>=0.24.0",
]
cu130 = [
  "torch==2.9.0",
  "torchvision>=0.24.0",
]

# --- uv Configuration ---
[tool.uv]
package = true
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# --- Ruff Configuration ---
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = []

# --- ty Configuration ---
[tool.ty]

# --- pytest Configuration ---
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra -q --strict-markers",
]
testpaths = ["tests"]

# --- Poe the Poet Configuration ---
[tool.poe.tasks]
qa = { sequence = [
  { cmd = "uv run ruff format --check", ignore_fail = true },
  { cmd = "uv run ruff check", ignore_fail = true },
  { cmd = "uv run ty check", ignore_fail = true },
  { cmd = "uv run pytest", ignore_fail = true }
], help = "Run all QA checks" }

qa-fix = { sequence = [
  { cmd = "uv run ruff format", ignore_fail = true },
  { cmd = "uv run ruff check --fix", ignore_fail = true },
  { cmd = "uv run ty check", ignore_fail = true },
  { cmd = "uv run pytest", ignore_fail = true }
], help = "Fix code style and run tests" }

train = { cmd = "uv run pag train", help = "Train models" }
attack = { cmd = "uv run pag attack", help = "Run attacks" }
evaluate = { cmd = "uv run pag evaluate", help = "Evaluate results" }

clean = { cmd = """
python -c "import shutil, pathlib; 
[shutil.rmtree(p, ignore_errors=True) for p in ['.pytest_cache', '.ruff_cache', '.venv', 'dist', 'build']]; 
[shutil.rmtree(p, ignore_errors=True) for p in pathlib.Path('.').rglob('__pycache__')]"
""", help = "Clean build artifacts and caches" }
